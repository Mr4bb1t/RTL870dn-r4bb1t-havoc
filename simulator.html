<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R4BB1T Deauther - OLED Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #161c28 0%, #080b11 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      overflow-x: hidden;
      padding: 20px;
    }

    .header-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-title h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .header-title p {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Device Enclosure */
    .device {
      background: linear-gradient(145deg, #232b3b, #131822);
      border: 2px solid #334155;
      border-radius: 28px;
      padding: 28px 32px;
      box-shadow:
        0 25px 60px -15px rgba(0, 0, 0, 0.8),
        inset 0 1px 2px rgba(255, 255, 255, 0.15),
        0 0 0 1px rgba(0, 0, 0, 0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 580px;
      max-width: 95vw;
    }

    /* Top Bar with Brand and RGB LED */
    .device-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 8px;
    }

    .device-brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #64748b;
      text-transform: uppercase;
    }

    .device-led-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .led-label {
      font-size: 10px;
      color: #475569;
      font-weight: bold;
    }

    .rgb-led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid #334155;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .rgb-led.blue {
      background: #00f0ff;
      box-shadow: 0 0 12px #00f0ff, inset 0 0 4px #fff;
    }

    .rgb-led.red {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444, inset 0 0 4px #fff;
    }

    .rgb-led.green {
      background: #10b981;
      box-shadow: 0 0 12px #10b981, inset 0 0 4px #fff;
    }

    /* Screen Glass and Bezel */
    .screen-bezel {
      background: #020408;
      border: 3px solid #1e293b;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(255, 255, 255, 0.05);
      position: relative;
      margin-bottom: 26px;
      overflow: hidden;
    }

    .screen-glass {
      position: relative;
      background: #000204;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
    }

    .screen-glass::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 4px);
      pointer-events: none;
    }

    #oled {
      display: block;
      width: 512px;
      height: 256px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* 5-Button Tactical D-Pad Panel */
    .controls-cluster {
      display: grid;
      grid-template-columns: 82px 98px 82px;
      grid-template-rows: 48px 48px 48px;
      gap: 7px;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 6px 0 10px 0;
    }

    .btn {
      background: linear-gradient(180deg, #334155, #1e293b);
      border: 1px solid #475569;
      color: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      border-radius: 12px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0f172a, 0 8px 12px -2px rgba(0, 0, 0, 0.4);
      transition: all 0.08s ease;
      width: 100%;
      height: 100%;
    }

    .btn:hover {
      background: linear-gradient(180deg, #3b4861, #243046);
      border-color: #64748b;
    }

    .btn:active,
    .btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f172a, 0 3px 6px rgba(0, 0, 0, 0.3);
    }

    .btn .pin {
      font-size: 8px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-up {
      grid-column: 2;
      grid-row: 1;
    }

    .btn-left {
      grid-column: 1;
      grid-row: 2;
    }

    .btn-enter {
      grid-column: 2;
      grid-row: 2;
    }

    .btn-right {
      grid-column: 3;
      grid-row: 2;
    }

    .btn-down {
      grid-column: 2;
      grid-row: 3;
    }

    .btn.sel {
      background: linear-gradient(180deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      box-shadow: 0 4px 0 #0c4a6e, 0 8px 12px -2px rgba(14, 165, 233, 0.4);
    }

    .btn.sel:hover {
      background: linear-gradient(180deg, #0ea5e9, #0284c7);
    }

    .btn.sel:active,
    .btn.sel.pressed {
      box-shadow: 0 1px 0 #0c4a6e;
    }

    /* Keyboard Shortcuts Legend */
    .keyboard-hint {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      font-size: 11px;
      color: #64748b;
    }

    .kbd {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 2px 6px;
      color: #94a3b8;
      font-weight: bold;
    }

    /* Screen Quick Jump Toolbar */
    .screen-nav {
      margin-top: 20px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }

    .screen-nav-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .screen-nav-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: #334155;
      color: #f1f5f9;
      border-color: #64748b;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(14, 165, 233, 0.5);
    }
  </style>
</head>

    function getStrWidth(str) {
      return str.length * 6;
    }

    function drawStr(x, y, str, color = 1) {
      x = Math.round(x); y = Math.round(y);
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const glyph = FONT_MAP[ch] || FONT_MAP[' '];
        for (let col = 0; col < 5; col++) {
          const b = glyph[col];
          for (let row = 0; row < 7; row++) {
            if (b & (1 << row)) {
              drawPixel(x + i * 6 + col, y - 7 + row, color);
            }
          }
        }
      }
    }

    function drawStrCentered(y, str, color = 1) {
      const w = getStrWidth(str);
      const x = Math.max(0, Math.round((128 - w) / 2));
      drawStr(x, y, str, color);
    }

    function getStrWidth2x(str) {
      return str.length * 12;
    }

    function drawStr2x(x, y, str, color = 1) {
      x = Math.round(x); y = Math.round(y);
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const glyph = FONT_MAP[ch] || FONT_MAP[' '];
        for (let col = 0; col < 5; col++) {
          const b = glyph[col];
          for (let row = 0; row < 7; row++) {
            if (b & (1 << row)) {
              const px = x + i * 12 + col * 2;
              const py = y - 14 + row * 2;
              drawPixel(px, py, color);
              drawPixel(px + 1, py, color);
              drawPixel(px, py + 1, color);
              drawPixel(px + 1, py + 1, color);
            }
          }
        }
      }
    }

    function drawStrCentered2x(y, str, color = 1) {
      const w = getStrWidth2x(str);
      const x = Math.max(0, Math.round((128 - w) / 2));
      drawStr2x(x, y, str, color);
    }

    function drawHLine(x, y, w, color = 1) {
      drawLine(x, y, x + w - 1, y, color);
    }

    function drawVLine(x, y, h, color = 1) {
      drawLine(x, y, x, y + h - 1, color);
    }

    function draw_corner_brackets(x, y, w, h, len = 6) {
      // Top-Left
      drawHLine(x, y, len, 1);
      drawVLine(x, y, len, 1);
      // Top-Right
      drawHLine(x + w - len, y, len, 1);
      drawVLine(x + w - 1, y, len, 1);
      // Bottom-Left
      drawHLine(x, y + h - 1, len, 1);
      drawVLine(x, y + h - len, len, 1);
      // Bottom-Right
      drawHLine(x + w - len, y + h - 1, len, 1);
      drawVLine(x + w - 1, y + h - len, len, 1);
    }

    function draw_header(title, badge = "") {
      drawBox(0, 0, 128, 10, 1);
      drawStr(3, 8, title, 0);
      if (badge) {
        const bw = getStrWidth(badge);
        drawStr(125 - bw, 8, badge, 0);
      }
    }

    function draw_signal_bars(x, y, rssi, color = 1) {
      let bars = 1;
      if (rssi > -60) bars = 4;
      else if (rssi > -70) bars = 3;
      else if (rssi > -80) bars = 2;

      for (let b = 0; b < 4; b++) {
        const bx = x + b * 3;
        const bh = 2 + b * 2; // heights 2, 4, 6, 8
        const by = y + 8 - bh;
        if (b < bars) {
          drawBox(bx, by, 2, bh, color);
        } else {
          drawPixel(bx, y + 7, color);
        }
      }
    }

        const r = scan_results[idx];
        const isSel = (idx === net_sel);

        if (isSel) {
          drawBox(0, y - 8, 122, 10, 1);
        }
        const color = isSel ? 0 : 1;

        // Checkbox: 7x7 at x=1, y=y-7
        drawFrame(1, y - 7, 7, 7, color);
        if (net_marked[idx]) {
          drawBox(3, y - 5, 3, 3, color);
        }

        // SSID (marquee scroll when selected if length > 9)
        let ssidDisplay = r.ssid.substring(0, 9);
        if (isSel && r.ssid.length > 9) {
          const mOffset = Math.floor((Date.now() / 320) % (r.ssid.length + 3));
          ssidDisplay = (r.ssid + "   " + r.ssid).substring(mOffset, mOffset + 9);
        }
        drawStr(10, y, ssidDisplay, color);

        // Band badge [5G] / [2G] (X=68)
        drawStr(68, y, r.is5GHz ? "5G" : "2G", color);

        // Staggered Signal Meter (X=82)
        draw_signal_bars(82, y - 8, r.rssi, color);

        // Channel number (X=94 - ample room for 3 digits e.g. c149)
        drawStr(94, y, `c${r.channel}`, color);
      }

      // Vertical Scrollbar on Right Edge - Full height Y=12..62
      drawVLine(125, 12, 50, 1);
      const trackHeight = 46;
      const thumbHeight = Math.max(8, Math.round((visible / scan_results.length) * trackHeight));
      const maxScroll = Math.max(1, scan_results.length - visible);
      const thumbY = 14 + Math.round((net_scroll / maxScroll) * (trackHeight - thumbHeight));
      drawBox(124, thumbY, 3, thumbHeight, 1);
    }

    // Screen 5: Confirm Deauth Attack
    function render_deauth_confirm() {
      draw_header("CONFIRM ATTACK", "DEAUTH");

      let count = 0;
      for (let i = 0; i < scan_results.length; i++) if (net_marked[i]) count++;

      // Warning Triangle Icon on Left with centered exclamation mark
      drawTriangle(12, 17, 4, 32, 20, 32, 1);
      drawVLine(12, 22, 5, 0);
      drawPixel(12, 29, 0);

      if (count === 0) {
        drawStr(25, 21, "NO TARGETS MARKED!");
        drawStr(25, 32, "Select APs in Net List.");
        drawStr(25, 42, "Dual-Band 2.4G / 5G");
      } else {
        drawStr(25, 21, `TARGETS: ${count} AP(s)`);
        let firstMarked = "";
        for (let i = 0; i < scan_results.length; i++) {
          if (net_marked[i]) { firstMarked = scan_results[i].ssid; break; }
        }
        drawStr(25, 31, `"${firstMarked.substring(0, 14)}"`);
        drawStr(25, 41, "Deauth Disconnect Spam");
      }

      // Two balanced, comfortable action buttons at Y=46..60 (height 15px)
      draw_btn(10, 46, 50, 15, "CANCEL", menu_sel === 1);
      draw_btn(68, 46, 50, 15, count === 0 ? "RETURN" : "ATTACK", menu_sel === 0);
    }

    // Screen 6: Deauth Attack Active (No Footer Bar, New Meaningful AP <-> Client Broken Link Animation)
    function render_deauth_running() {
      draw_header("* DEAUTH ATTACK *", "RUN");

      // Left Column: Meaningful Wi-Fi Link Disruption Graphic (X=2..34, Y=14..62)
      // 1. Access Point (Router) at Top Left (X=5, Y=18)
      drawRFrame(5, 18, 18, 8, 1, 1); // Router chassis
      drawVLine(8, 13, 5, 1);         // Left Antenna
      drawPixel(8, 12, 1);
      drawVLine(20, 13, 5, 1);        // Right Antenna
      drawPixel(20, 12, 1);
      drawPixel(10, 22, 1);           // Router status LED 1
      drawPixel(14, 22, 1);           // Router status LED 2

      // 2. Client Smartphone at Bottom Left (X=8, Y=44)
      drawRFrame(8, 44, 12, 18, 2, 1); // Phone body
      drawFrame(10, 46, 8, 12, 1);     // Screen frame
      drawHLine(12, 60, 4, 1);         // Home button indicator

      // 3. Wi-Fi Wireless Link & Deauth Disruption Strike (Y=26..43)
      // Normal Wi-Fi wave emitted from router downwards
      drawCircle(14, 26, 4, 0x0C, 1);

      // Deauth frame disruption in 4 alternating phases
      const strikePhase = Math.floor((Date.now() / 90) % 4);
      if (strikePhase === 0) {
        // Attack packet injecting from right towards link
        drawHLine(24, 34, 6, 1);
        drawLine(27, 32, 24, 34, 1);
        drawLine(27, 36, 24, 34, 1);
        drawDisc(14, 34, 2, 1); // Radio interference cluster
      } else if (strikePhase === 1) {
        // High-voltage Deauth lightning bolt severing the wave
        drawLine(20, 27, 12, 33, 1);
        drawLine(12, 33, 18, 36, 1);
        drawLine(18, 36, 10, 43, 1);
        drawPixel(7, 35, 1);
        drawPixel(22, 35, 1);
      } else if (strikePhase === 2) {
        // Broken Chain Link [---] / [---]
        drawHLine(7, 33, 4, 1);
        drawVLine(7, 34, 3, 1);
        drawHLine(7, 37, 4, 1);

        drawHLine(17, 33, 4, 1);
        drawVLine(20, 34, 3, 1);
        drawHLine(17, 37, 4, 1);

        // Slashing blade cutting the link
        drawLine(11, 39, 17, 31, 1);
      } else {
        // Disconnected 'X' with burst spark particles
        drawLine(11, 32, 17, 38, 1);
        drawLine(11, 38, 17, 32, 1);
        drawPixel(8, 30, 1);
        drawPixel(20, 30, 1);
        drawPixel(8, 40, 1);
        drawPixel(20, 40, 1);
      }

      // Cycling through marked targets with marquee scroll if long
      let markedIndices = [];
      for (let i = 0; i < scan_results.length; i++) {
        if (net_marked[i]) markedIndices.push(i);
      }
      let curTarget = scan_results[0];
      if (markedIndices.length > 0) {
        const tIdx = markedIndices[Math.floor((Date.now() / 2000) % markedIndices.length)];
        curTarget = scan_results[tIdx];
      }
      let targetDisplay = curTarget.ssid.substring(0, 10);
      if (curTarget.ssid.length > 10) {
        const offset = Math.floor((Date.now() / 300) % (curTarget.ssid.length + 3));
        targetDisplay = (curTarget.ssid + "   " + curTarget.ssid).substring(offset, offset + 10);
      }

      // Right Side: Minimal, spacious Attack Telemetry (Only 3 essential lines with 14px spacing!)
      drawStr(36, 24, `TGT : ${targetDisplay}`);
      drawStr(36, 38, `CH  : ${curTarget.channel} [${curTarget.is5GHz ? "5G" : "2G"}]`);
      drawStr(36, 52, `PKTS: ${sent_frames.toLocaleString()}`);
    }

    // Screen 7: Confirm Beacon Flood
    function render_beacon_confirm() {
      draw_header("CONFIRM BEACON", "25AP");

      // Compact Radio Broadcast Mast with Lattice Structure & Wave Arcs
      const tx = 13, ty = 31;

      // Tower Legs & Horizontal Base (compact 18px height)
      drawLine(tx - 6, ty + 9, tx, ty - 9, 1);
      drawLine(tx + 6, ty + 9, tx, ty - 9, 1);
      drawHLine(tx - 7, ty + 9, 15, 1);

      // Lattice Crossbars & Bracing
      drawHLine(tx - 4, ty + 4, 9, 1);
      drawHLine(tx - 2, ty - 1, 5, 1);
      drawLine(tx - 4, ty + 4, tx + 2, ty - 1, 1);
      drawLine(tx + 4, ty + 4, tx - 2, ty - 1, 1);

      // Mast Spire & Beacon Emitter Bulb
      drawVLine(tx, ty - 12, 3, 1);
      drawDisc(tx, ty - 13, 1, 1);

      // Concentric Broadcast Wave Arcs
      drawCircle(tx, ty - 13, 4, 0x03, 1);
      drawCircle(tx, ty - 13, 7, 0x03, 1);

      drawStr(27, 21, "SPAM 25 FAKE APs");
      drawStr(27, 31, "Dual-Band 2.4G/5G");
      drawStr(27, 41, "SSID Broadcast");

      // Two balanced, comfortable action buttons at Y=46..60 (height 15px)
      draw_btn(10, 46, 50, 15, "CANCEL", menu_sel === 1);
      draw_btn(68, 46, 50, 15, "START", menu_sel === 0);
    }

    // Screen 8: Beacon Flood Active
    function render_beacon_running() {
      draw_header("* BEACON FLOOD *", "25AP");

      // Left: Compact Broadcast Station with Expanding RF Waves
      const tx = 17, ty = 34;

      // Tower Legs & Lattice Structure (compact 18px height)
      drawLine(tx - 6, ty + 9, tx, ty - 9, 1);
      drawLine(tx + 6, ty + 9, tx, ty - 9, 1);
      drawHLine(tx - 7, ty + 9, 15, 1);

      drawHLine(tx - 4, ty + 4, 9, 1);
      drawHLine(tx - 2, ty - 1, 5, 1);
      drawLine(tx - 4, ty + 4, tx + 2, ty - 1, 1);
      drawLine(tx + 4, ty + 4, tx - 2, ty - 1, 1);

      // Spire & Pulsing Emitter Bulb
      drawVLine(tx, ty - 12, 3, 1);
      const b_pulse = Math.floor((Date.now() / 150) % 2);
      if (b_pulse) {
        drawDisc(tx, ty - 13, 1, 1);
      } else {
        drawPixel(tx, ty - 13, 1);
      }

      // Continuous Expanding RF Broadcast Waves
      const w1 = 3 + Math.round(((Date.now()) % 900) / 900 * 12);
      const w2 = 3 + Math.round(((Date.now() + 450) % 900) / 900 * 12);
      if (w1 <= 15) drawCircle(tx, ty - 13, w1, 0x03, 1);
      if (w2 <= 15) drawCircle(tx, ty - 13, w2, 0x03, 1);

      // Right Side: Minimal, spacious telemetry (3 elements total)
      drawStr(36, 24, `PKTS: ${beacon_frames.toLocaleString()}`);
      drawStr(36, 37, "SPAM: 25 SSIDs");

      // Fake SSID Ticker in an inverted badge with breathing room
      const fakeNames = ["FBI Surv Van 04", "Starbucks Free", "iPhone 15 Hotspot", "Virus.exe_WiFi", "5G_Tower_Test"];
      const curFake = fakeNames[Math.floor((Date.now() / 800) % fakeNames.length)];
      drawRBox(35, 47, 91, 12, 1, 1);
      drawStr(39, 56, curFake.substring(0, 14), 0);
    }

    // Screen 9: Bluetooth Spam Menu
    function render_ble_menu() {
      draw_header("BLUETOOTH SPAM", "APPLE");

      // Left: Mini Bluetooth Symbol (scaled down from main menu icon)
      drawXBMP(10, 18, 24, 24, BT_24X24_FRAMES[0]);

      // Right: Feature overview
      drawStr(42, 29, "Apple BLE");
      drawStr(42, 39, "Spam");


      // Prominent Action Button
      draw_btn(18, 48, 92, 13, "START BLE SPAM", true);
    }

    // Screen 10: Bluetooth Spam Active (Spacious, Zero Overlap, No Clutter)
    function render_ble_running() {
      draw_header("* BLE SPAM *", "ACTIVE");

      // Left: Mini Bluetooth Symbol animating with pulsing radio waves (from main menu icon)
      drawXBMP(5, 19, 24, 24, BT_24X24_FRAMES[center_anim_frame % 14]);

      // Right Side: Clean, spacious telemetry with abundant airgap
      drawStr(34, 24, `PKTS: ${ble_pkt_sent.toLocaleString()}`);
      drawStr(34, 37, "TARGET: Iphone");

      // Prominent Device Name Inverted Pill (Y=47..59) - only element in lower area!
      const devName = APPLE_NAMES[ble_spam_idx];
      drawRBox(33, 47, 93, 12, 1, 1);
      drawStr(37, 56, devName.substring(0, 14), 0);
    }

    // Screen 11: System Info / About (No bottom bar)
    function render_about() {
      draw_header("DEVICE INFO", "AmebaD");

      // Structured micro-specs layout across full screen
      drawStr(4, 22, "SOC : RTL8720DN BW16");
      drawStr(4, 32, "WIFI: 2.4GHz + 5GHz");
      drawStr(4, 42, "BLE : Bluetooth 5.0");
      drawStr(4, 52, "DISP: SH1106 128x64");
      drawStr(4, 61, "FIRM: HAVOC v2.4");
    }

    function render_screen() {
      clearBuffer();
      switch (current_screen) {
        case SCR_SPLASH: render_splash(); break;
        case SCR_MAIN_MENU: render_main_menu(); break;
        case SCR_WIFI_MENU: render_wifi_menu(); break;
        case SCR_SCANNING: render_scanning(); break;
        case SCR_NET_LIST: render_net_list(); break;
        case SCR_DEAUTH_CONFIRM: render_deauth_confirm(); break;
        case SCR_DEAUTH_RUNNING: render_deauth_running(); break;
        case SCR_BEACON_CONFIRM: render_beacon_confirm(); break;
        case SCR_BEACON_RUNNING: render_beacon_running(); break;
        case SCR_BLE_MENU: render_ble_menu(); break;
        case SCR_BLE_RUNNING: render_ble_running(); break;
        case SCR_ABOUT: render_about(); break;
      }
      sendBuffer();
      updateNavButtons();
    }

    // Animation Tick Loop (40 FPS, 25ms)
    let lastAnimTime = 0;
    let lastCenterAnimTime = 0;
    let lastArrowLTime = 0;
    let lastArrowRTime = 0;

    function loop(now) {
      // Submenu spinner / general anim (every 200ms)
      if (now - lastAnimTime > 200) {
        anim_frame = (anim_frame + 1) % 4;
        lastAnimTime = now;
      }

      // Center 48x48 icon animation (every 80ms)
      if (now - lastCenterAnimTime > 80) {
        center_anim_frame = (center_anim_frame + 1) % 14;
        lastCenterAnimTime = now;
      }

      // Left arrow movement animation
      if (arrow_left_anim) {
        if (now - lastArrowLTime > 28) {
          lastArrowLTime = now;
          arrow_left_frame++;
          if (arrow_left_frame >= 10) {
            arrow_left_frame = 0;
            arrow_left_anim = false;
          }
        }
      }

      // Right arrow movement animation
      if (arrow_right_anim) {
        if (now - lastArrowRTime > 28) {
          lastArrowRTime = now;
          arrow_right_frame++;
          if (arrow_right_frame >= 10) {
            arrow_right_frame = 0;
            arrow_right_anim = false;
          }
        }
      }

      // WiFi Lateral Menu Slide Animation (Smooth Lerp/Ease-Out)
      if (current_screen === SCR_WIFI_MENU) {
        wifi_menu_target_x = menu_sel * 128;
        if (wifi_menu_cur_x !== wifi_menu_target_x) {
          const diff = wifi_menu_target_x - wifi_menu_cur_x;
          let step = Math.round(diff / 3);
          if (step === 0) step = diff > 0 ? 1 : -1;
          wifi_menu_cur_x += step;
        }
      }

      // Active attack simulations
      if (current_screen === SCR_DEAUTH_RUNNING) {
        sent_frames += 5;
        setLED(sent_frames % 2 === 0 ? "red" : "");
      } else if (current_screen === SCR_BEACON_RUNNING) {
        beacon_frames += 12;
        setLED(beacon_frames % 2 === 0 ? "blue" : "");
      } else if (current_screen === SCR_BLE_RUNNING) {
        ble_pkt_sent += 2;
        if (ble_pkt_sent % 30 === 0) ble_spam_idx = (ble_spam_idx + 1) % APPLE_NAMES.length;
        setLED(ble_pkt_sent % 2 === 0 ? "green" : "");
      }

      render_screen();
      requestAnimationFrame(loop);
    }

    // Inputs Simulation (5-Button Tactical D-Pad)
    function flashBtn(id) {
      const b = document.getElementById(id);
      if (b) {
        b.classList.add("pressed");
        setTimeout(() => b.classList.remove("pressed"), 120);
      }
    }

    function pressUp() {
      flashBtn("btn-up");
      if (current_screen === SCR_MAIN_MENU) {
        menu_sel = (menu_sel - 1 + 3) % 3;
        trigger_arrow_left();
      } else if (current_screen === SCR_WIFI_MENU) {
        menu_sel = (menu_sel - 1 + 4) % 4;
      } else if (current_screen === SCR_NET_LIST) {
        if (net_sel > 0) net_sel--;
        if (net_sel < net_scroll) net_scroll = net_sel;
      } else if (current_screen === SCR_DEAUTH_CONFIRM || current_screen === SCR_BEACON_CONFIRM) {
        menu_sel = (menu_sel + 1) % 2;
      }
    }

    function pressDown() {
      flashBtn("btn-dn");
      if (current_screen === SCR_MAIN_MENU) {
        menu_sel = (menu_sel + 1) % 3;
        trigger_arrow_right();
      } else if (current_screen === SCR_WIFI_MENU) {
        menu_sel = (menu_sel + 1) % 4;
      } else if (current_screen === SCR_NET_LIST) {
        if (net_sel < scan_results.length - 1) net_sel++;
        if (net_sel >= net_scroll + 5) net_scroll = net_sel - 4;
      } else if (current_screen === SCR_DEAUTH_CONFIRM || current_screen === SCR_BEACON_CONFIRM) {
        menu_sel = (menu_sel + 1) % 2;
      } else if (current_screen === SCR_DEAUTH_RUNNING) {
        current_screen = SCR_WIFI_MENU;
        menu_sel = 0;
        wifi_menu_cur_x = 0;
        setLED("");
      } else if (current_screen === SCR_BEACON_RUNNING) {
        current_screen = SCR_WIFI_MENU;
        menu_sel = 1;
        wifi_menu_cur_x = 128;
        setLED("");
      } else if (current_screen === SCR_BLE_MENU) {
        current_screen = SCR_MAIN_MENU;
        menu_sel = 1;
      } else if (current_screen === SCR_BLE_RUNNING) {
        current_screen = SCR_MAIN_MENU;
        menu_sel = 1;
        setLED("");
      } else if (current_screen === SCR_ABOUT) {
        current_screen = SCR_MAIN_MENU;
        menu_sel = 2;
      }
    }

    function pressLeft() {
      flashBtn("btn-left");
      if (current_screen === SCR_MAIN_MENU) {
        menu_sel = (menu_sel - 1 + 3) % 3;
        trigger_arrow_left();
      } else if (current_screen === SCR_WIFI_MENU) {
        menu_sel = (menu_sel - 1 + 4) % 4;
      } else if (current_screen === SCR_NET_LIST) {
        // Quick return to WiFi Menu
        current_screen = SCR_WIFI_MENU;
        menu_sel = 0;
        wifi_menu_cur_x = 0;
      } else if (current_screen === SCR_DEAUTH_CONFIRM || current_screen === SCR_BEACON_CONFIRM) {
        menu_sel = 1; // CANCEL
      } else if (current_screen === SCR_DEAUTH_RUNNING) {
        current_screen = SCR_WIFI_MENU;
        menu_sel = 0;
        wifi_menu_cur_x = 0;
        setLED("");
      } else if (current_screen === SCR_BEACON_RUNNING) {
        current_screen = SCR_WIFI_MENU;
        menu_sel = 1;
        wifi_menu_cur_x = 128;
        setLED("");
      } else if (current_screen === SCR_BLE_MENU) {
        current_screen = SCR_MAIN_MENU;
        menu_sel = 1;
      } else if (current_screen === SCR_BLE_RUNNING) {
        current_screen = SCR_MAIN_MENU;
        menu_sel = 1;
        setLED("");
      } else if (current_screen === SCR_ABOUT) {
        current_screen = SCR_MAIN_MENU;
        menu_sel = 2;
      }
    }

    function pressRight() {
      flashBtn("btn-right");
      if (current_screen === SCR_MAIN_MENU) {
        menu_sel = (menu_sel + 1) % 3;
        trigger_arrow_right();
      } else if (current_screen === SCR_WIFI_MENU) {
        menu_sel = (menu_sel + 1) % 4;
      } else if (current_screen === SCR_NET_LIST) {
        // Quick proceed to Deauth Attack Confirmation
        current_screen = SCR_DEAUTH_CONFIRM;
        menu_sel = 0;
      } else if (current_screen === SCR_DEAUTH_CONFIRM || current_screen === SCR_BEACON_CONFIRM) {
        menu_sel = 0; // ATTACK / START
      } else if (current_screen === SCR_BLE_MENU) {
        current_screen = SCR_BLE_RUNNING;
        ble_pkt_sent = 0;
      }
    }

    function pressEnter() {
      flashBtn("btn-sel");
      if (current_screen === SCR_MAIN_MENU) {
        if (menu_sel === 0) {
          do_scan();
        } else if (menu_sel === 1) {
          current_screen = SCR_BLE_MENU;
          menu_sel = 0;
        } else {
          current_screen = SCR_ABOUT;
        }
      } else if (current_screen === SCR_WIFI_MENU) {
        if (menu_sel === 0) {
          current_screen = SCR_NET_LIST;
          net_sel = 0;
          net_scroll = 0;
        } else if (menu_sel === 1) {
          current_screen = SCR_BEACON_CONFIRM;
          menu_sel = 0;
        } else if (menu_sel === 2) {
          do_scan();
        } else {
          current_screen = SCR_MAIN_MENU;
          menu_sel = 0;
        }
      } else if (current_screen === SCR_NET_LIST) {
        // Toggle Mark / Checkbox
        if (scan_results.length > 0) {
          net_marked[net_sel] = !net_marked[net_sel];
        }
      } else if (current_screen === SCR_DEAUTH_CONFIRM) {
        if (menu_sel === 0) {
          current_screen = SCR_DEAUTH_RUNNING;
          sent_frames = 0;
        } else {
          current_screen = SCR_WIFI_MENU;
          menu_sel = 0;
          wifi_menu_cur_x = 0;
        }
      } else if (current_screen === SCR_DEAUTH_RUNNING) {
        current_screen = SCR_WIFI_MENU;
        menu_sel = 0;
        wifi_menu_cur_x = 0;
        setLED("");
      } else if (current_screen === SCR_BEACON_CONFIRM) {
        if (menu_sel === 0) {
          current_screen = SCR_BEACON_RUNNING;
          beacon_frames = 0;
        } else {
          current_screen = SCR_WIFI_MENU;
          menu_sel = 1;
          wifi_menu_cur_x = 128;
        }
      } else if (current_screen === SCR_BEACON_RUNNING) {
        current_screen = SCR_WIFI_MENU;
        menu_sel = 1;
        wifi_menu_cur_x = 128;
        setLED("");
      } else if (current_screen === SCR_BLE_MENU) {
        current_screen = SCR_BLE_RUNNING;
        ble_pkt_sent = 0;
      } else if (current_screen === SCR_BLE_RUNNING) {
        current_screen = SCR_MAIN_MENU;
        menu_sel = 1;
        setLED("");
      } else if (current_screen === SCR_ABOUT) {
        current_screen = SCR_MAIN_MENU;
        menu_sel = 2;
      }
    }

    // Bind Button Clicks
    document.getElementById("btn-up").addEventListener("click", pressUp);
    document.getElementById("btn-dn").addEventListener("click", pressDown);
    document.getElementById("btn-left").addEventListener("click", pressLeft);
    document.getElementById("btn-right").addEventListener("click", pressRight);
    document.getElementById("btn-sel").addEventListener("click", pressEnter);

    // Keyboard Listeners (Arrow keys, WASD, Enter, Space)
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
        pressUp();
      } else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
        pressDown();
      } else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
        pressLeft();
      } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
        pressRight();
      } else if (e.key === "Enter" || e.key === " " || e.key === "e" || e.key === "E") {
        pressEnter();
      }
    });

    // Boot Splash Sequence (2.5s)
    setTimeout(() => {
      if (current_screen === SCR_SPLASH) {
        current_screen = SCR_MAIN_MENU;
      }
    }, 2500);

    // Start Simulation Loop
    requestAnimationFrame(loop);
  </script>
</body>

</html>
